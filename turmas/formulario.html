<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turma - SISGED</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-base="../" data-pagina="turmas-form">
<nav class="navbar sisged-topbar px-3 no-print">
  <a class="navbar-brand d-flex align-items-center gap-3 text-white fw-bold" href="../dashboard.html">
    <img src="../assets/img/senai_negativa.png" alt="SENAI" height="34">
    <img src="../assets/img/sesi_negativa.png" alt="SESI" height="34">
    <span>SISGED</span>
  </a>
  <div class="d-flex align-items-center gap-3 text-white">
    <span id="usuario-nome" class="small"></span>
    <button type="button" id="btn-sair" class="btn btn-sm btn-outline-light">Sair</button>
  </div>
</nav>
<div class="d-flex flex-column flex-md-row">
  <aside class="sisged-sidebar no-print">
    <nav class="nav flex-column pt-2">
      <a class="nav-link" href="../dashboard.html">Painel</a>
      <a class="nav-link active" href="../turmas/listar.html">Turmas</a>
      <a class="nav-link" href="../salas/listar.html" data-perfis="coordenacao">Salas</a>
    </nav>
  </aside>
  <main class="sisged-content flex-grow-1 p-4">
    <h2 class="page-title" id="titulo">Turma</h2>
    <div id="erro" class="alert alert-danger d-none"></div>
    <div class="form-card" style="max-width:640px">
      <form id="form" novalidate>
        <div class="mb-3"><label class="form-label">Nome da turma *</label><input type="text" name="nome" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Disciplina *</label><input type="text" name="disciplina" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Instrutor responsável *</label><select name="instrutor_id" class="form-select" required></select></div>
        <div class="row">
          <div class="col-md-4 mb-3"><label class="form-label">Data início</label><input type="date" name="data_inicio" class="form-control"></div>
          <div class="col-md-4 mb-3"><label class="form-label">Data fim</label><input type="date" name="data_fim" class="form-control"></div>
          <div class="col-md-4 mb-3"><label class="form-label">Turno</label>
            <select name="turno" class="form-select"><option>Manhã</option><option>Tarde</option><option>Noite</option></select></div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a href="listar.html" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="../assets/js/dados.js"></script>
<script src="../assets/js/script.js"></script>
</body>
</html>
