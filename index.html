<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar - SISGED</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-base="" data-pagina="login">
<div class="login-wrapper">
  <div class="login-card">
    <div class="d-flex justify-content-center gap-3 mb-3">
      <img src="assets/img/senai_cor.png" alt="SENAI" height="40">
      <img src="assets/img/sesi_cor.png" alt="SESI" height="40">
    </div>
    <h1>SISGED</h1>
    <p class="subtitulo">Versão de demonstração (front-end)</p>
    <div class="alert alert-info small">Não há login real. Escolha um perfil para explorar a interface com dados fictícios.</div>
    <form id="form-login">
      <div class="mb-3">
        <label for="perfil" class="form-label">Entrar como</label>
        <select id="perfil" class="form-select">
          <option value="coordenacao">Coordenação</option>
          <option value="instrutor">Instrutor</option>
          <option value="aluno">Aluno</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>
</div>
<script src="assets/js/dados.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
